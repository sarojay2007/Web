<!DOCTYPE html>
<html>
    <head>
        <title> Internal CSS with javaScript</title>
        <style>
            body {
                font-family:Arial;
                background-color: lightblue;
                text-align:center;
            }
            h1 {
                color: darkblue;
            }
            p{
                font-size: 20px;
            }
            button{
                padding: 10px 20px;
                font-size: 16px;
            }
        </style>
        <script>
            function changeText() {
                document.getElementById("message").innerHTML="Welcome to javaScript!";
            }
        </script>
    </head>
    <body>
        <h1>Internal CSS Demonstraition</h1>
        <p id=""message">Click the button to change this text.</p>
        <button onclick=""changeText()"> click Here</button>
        
    </body>
</html>
